[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phosphene-imi"
version = "0.1.0"
description = "IMI publish and distribute pipeline — phosphene-imi."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "behave>=1.2",
    "temporalio>=1.6",
    "mwclient>=0.11.0",
    "phosphene-temporal",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=0.23",
    "flask>=3.0",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/phosphene"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires Docker or live services — skip with -m 'not integration'",
]

[tool.ruff]
line-length = 88
target-version = "py312"
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "RUF"]

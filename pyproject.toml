[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phosphene-imi"
version = "0.2.0"
description = "IMI Syndication Pipeline — contractual media syndication via Temporal."
requires-python = ">=3.12"
license = "MIT"
readme = "README.md"

dependencies = [
    "pydantic>=2.0",
    "temporalio>=1.6",
    "mwclient>=0.11.0",
    "phosphene-temporal",
]

[project.optional-dependencies]
bdd = ["behave>=1.2"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=0.23",
    "behave>=1.2",
    "flask>=3.0",
    "ruff>=0.4",
]

[project.scripts]
imi-worker = "phosphene.imi.worker:main"
imi-gate = "phosphene.imi.gate_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/phosphene"]

[tool.uv.workspace]
members = ["lib/temporal"]

[tool.uv.sources]
phosphene-temporal = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/unit", "tests/integration"]
markers = [
    "live: tests requiring real external services (skip in CI)",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "RUF"]
ignore = ["ANN101", "ANN102", "ANN401"]

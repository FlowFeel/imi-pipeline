[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phosphene-imi"
version = "0.1.0"
description = "IMI publish and distribute pipeline — phosphene-imi."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "behave>=1.2",
    "temporalio>=1.6",
    "mwclient>=0.11.0",
    "phosphene-temporal",
    "imi-wordpress",
]

[tool.uv.workspace]
members = ["lib/temporal", "lib/imi_wordpress"]

[tool.uv.sources]
phosphene-temporal = { workspace = true }
imi-wordpress = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=0.23",
    "flask>=3.0",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/phosphene"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "tests/integration"]
markers = [
    "integration: requires Docker or live services — skip with -m 'not integration'",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "RUF"]
ignore = [
    "ANN101", "ANN102", "ANN401",
    "ANN001", "ANN002", "ANN003", "ANN201", "ANN202",
    "SIM117", "B017", "E501", "SIM102", "SIM103", "F401",
    "RUF005", "RUF015", "RUF059", "B007", "SIM105", "SIM118", "F841",
]

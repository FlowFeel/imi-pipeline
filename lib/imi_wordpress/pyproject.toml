[project]
name = "imi-wordpress"
version = "1.0.0"
description = "IMI WordPress client and scholarly domain models vendored for imi-pipeline"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phosphene"]

[tool.ruff]
line-length = 99
target-version = "py312"

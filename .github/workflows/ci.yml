name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "feat/**"
      - "fix/**"
      - "refactor/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_CACHE_DIR: /tmp/.uv-cache

jobs:

  # ─────────────────────────────────
  # Gate 1: Code Quality & Syntax
  # ─────────────────────────────────
  lint:
    name: "Lint & Format"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run ruff check src/ tests/ features/
      - run: uv run ruff format --check src/ tests/ features/
      - name: Validate PHP syntax in testdata
        run: find testdata/wp-mu-plugins -name "*.php" -exec php -l {} +

  # ─────────────────────────────────
  # Gate 2: Behavioral Proof (BDD)
  #
  # Outside-in: the contract is verified
  # before the internals. If BDD fails,
  # unit results are irrelevant.
  # ─────────────────────────────────
  bdd:
    name: "Behavioral Proof"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: mkdir -p reports
      - name: Run BDD features
        run: |
          uv run behave features/ \
            --tags ~@integration \
            --no-capture \
            --format json.pretty \
            --outfile reports/bdd-report.json \
            --format pretty

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bdd-report
          path: reports/bdd-report.json

  # ─────────────────────────────────
  # Gate 3: Unit Tests (T0 Pure Unit)
  # ─────────────────────────────────
  unit:
    name: "Unit Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - name: Run unit tests
        run: |
          uv run pytest tests/unit \
            -v --tb=short \
            --junitxml=reports/unit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-results
          path: reports/unit.xml

  # ─────────────────────────────────
  # Gate 4: Wire-Level Integration Tests (T2)
  #
  # Real HTTP wire tests against mock servers
  # for Observatory, WordPress, and Salesforce outlets.
  # Validates Kelly contracts and payload schemas.
  # ─────────────────────────────────
  integration:
    name: "Wire-Level Integration"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint, unit]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - name: Run wire-level integration tests
        run: |
          uv run pytest tests/integration \
            -m "not integration_live" \
            -v --tb=short \
            --junitxml=reports/integration.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-results
          path: reports/integration.xml

  # ─────────────────────────────────
  # Gate 5: DOI Harness (Docker E2E)
  #
  # Boots WP + MariaDB + Crossref stub.
  # Runs the DOI lifecycle BDD scenarios
  # and black-box citation-tag invariants
  # against the real rendered pages.
  # ─────────────────────────────────
  doi-harness:
    name: "DOI Harness (Docker)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, unit]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-extras

      - name: Boot DOI stack
        run: make doi-up

      - name: Run DOI harness
        run: make doi-test

      - name: Tear down
        if: always()
        run: make doi-down

  # ─────────────────────────────────
  # Summary Gate (Mandatory Merge Check)
  # ─────────────────────────────────
  ci-pass:
    name: "CI"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint, bdd, unit, integration, doi-harness]
    if: always()
    steps:
      - name: Check all gates
        run: |
          for r in "${{ needs.lint.result }}" "${{ needs.bdd.result }}" "${{ needs.unit.result }}" "${{ needs.integration.result }}" "${{ needs.doi-harness.result }}"; do
            if [ "$r" != "success" ]; then echo "Gate failed: $r"; exit 1; fi
          done
          echo "All 5 gates passed successfully"

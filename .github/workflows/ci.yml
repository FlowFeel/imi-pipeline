name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  UV_CACHE_DIR: /tmp/.uv-cache

jobs:

  # ─────────────────────────────────
  # Gate 1: Code Quality
  # ─────────────────────────────────
  lint:
    name: "Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run ruff check src/ tests/ features/
      - run: uv run ruff format --check src/ tests/ features/

  # ─────────────────────────────────
  # Gate 2: Behavioral Proof (BDD)
  #
  # Outside-in: the contract is verified
  # before the internals. If BDD fails,
  # unit results are irrelevant.
  # ─────────────────────────────────
  bdd:
    name: "Behavioral Proof"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: mkdir -p reports
      - name: Run BDD features
        run: |
          uv run behave features/ \
            --tags ~@integration \
            --no-capture \
            --format json.pretty \
            --outfile reports/bdd-report.json \
            --format pretty

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bdd-report
          path: reports/bdd-report.json

  # ─────────────────────────────────
  # Gate 3: Unit Tests (no Docker)
  # ─────────────────────────────────
  unit:
    name: "Unit Tests"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - name: Run unit tests
        run: |
          uv run pytest tests/unit \
            -v --tb=short \
            --junitxml=reports/unit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-results
          path: reports/unit.xml

  # ─────────────────────────────────
  # Gate 4: Integration (Docker) — Temporal + MW
  #
  # Marked continue-on-error until MW container entrypoint is refactored
  # to decouple legacy MediaWiki 2.1.1 extensions on GHA runners.
  # ─────────────────────────────────
  integration:
    name: "Integration (Docker)"
    runs-on: ubuntu-latest
    needs: [lint, unit]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-extras

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Start test stack
        run: docker compose -f testdata/docker-compose.test.yml up -d --wait

      - name: Capture container logs on failure
        if: failure()
        run: |
          echo "=== TEMPORAL LOGS ==="
          docker logs testdata-temporal-1 2>&1 || true
          echo "=== ES LOGS ==="
          docker logs testdata-elasticsearch-1 2>&1 || true
          echo "=== WEB LOGS ==="
          docker logs testdata-web-1 2>&1 || true

      - name: Run MW init scripts
        run: |
          docker exec testdata-web-1 bash /init/00-create-test-admin.sh
          docker exec testdata-web-1 bash /init/01-seed-test-pages.sh

      - name: Run all tests (Temporal + MW)
        run: |
          uv run pytest tests/unit tests/integration \
            -v --tb=short \
            --junitxml=reports/integration.xml

      - name: Tear down
        if: always()
        run: docker compose -f testdata/docker-compose.test.yml down -v

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-results
          path: reports/integration.xml

  # ─────────────────────────────────
  # Gate 5: DOI Harness (Docker)
  #
  # Boots WP + MariaDB + Crossref stub.
  # Runs the DOI lifecycle BDD scenarios
  # and black-box citation-tag invariants
  # against the real rendered pages.
  # ─────────────────────────────────
  doi-harness:
    name: "DOI Harness (Docker)"
    runs-on: ubuntu-latest
    needs: [lint, unit]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-extras

      - name: Boot DOI stack
        run: make doi-up

      - name: Run DOI harness
        run: make doi-test

      - name: Tear down
        if: always()
        run: make doi-down

  # ─────────────────────────────────
  # Summary Gate
  # ─────────────────────────────────
  ci-pass:
    name: "CI"
    runs-on: ubuntu-latest
    needs: [lint, bdd, unit, doi-harness]
    if: always()
    steps:
      - name: Check all gates
        run: |
          for r in "${{ needs.lint.result }}" "${{ needs.bdd.result }}" "${{ needs.unit.result }}" "${{ needs.doi-harness.result }}"; do
            if [ "$r" != "success" ]; then echo "Gate failed: $r"; exit 1; fi
          done
          echo "All gates passed"

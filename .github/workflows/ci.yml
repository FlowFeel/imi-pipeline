name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  UV_CACHE_DIR: /tmp/.uv-cache

jobs:
  # ─────────────────────────────────
  # Gate 1: Code Quality
  # ─────────────────────────────────
  lint:
    name: "🔍 Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with: { enable-cache: true }
      - run: uv sync --all-extras
      - run: uv run ruff check src/ tests/ features/
      - run: uv run ruff format --check src/ tests/ features/

  # ─────────────────────────────────
  # Gate 2: Behavioral Proof
  #
  # Outside-in: the contract is
  # verified before the internals.
  # If BDD fails, unit results are
  # irrelevant.
  #
  # Lineage: phosphene/go_bdd_reference
  # ─────────────────────────────────
  bdd:
    name: "📋 Behavioral Proof"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with: { enable-cache: true }
      - run: uv sync --all-extras
      - run: mkdir -p reports

      - name: Run BDD features
        run: |
          uv run behave features/ \
            --no-capture \
            --format json.pretty \
            --outfile reports/bdd-report.json \
            --format pretty

      - name: Summary
        if: always()
        run: |
          echo "## 📋 Behavioral Proof" >> $GITHUB_STEP_SUMMARY
          if [ -f reports/bdd-report.json ]; then
            python3 << 'PYEOF'
          import json, sys
          data = json.load(open("reports/bdd-report.json"))
          total = sum(len(f.get("elements",[])) for f in data)
          passed = sum(1 for f in data for sc in f.get("elements",[])
                       if all(s["result"]["status"]=="passed" for s in sc.get("steps",[])))
          print(f"| Metric | Count |")
          print(f"|--------|-------|")
          print(f"| Features | {len(data)} |")
          print(f"| Scenarios | {total} |")
          print(f"| ✅ Passed | {passed} |")
          print(f"| ❌ Failed | {total - passed} |")
          PYEOF
          fi >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bdd-report
          path: reports/bdd-report.json

  # ─────────────────────────────────
  # Gate 3: Unit + Integration
  #
  # Supporting evidence. Does not
  # replace the behavioral proof.
  # ─────────────────────────────────
  test:
    name: "🧪 Tests (py${{ matrix.python }})"
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with: { enable-cache: true }
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --all-extras --python ${{ matrix.python }}

      - name: Run tests
        run: |
          uv run pytest tests/unit tests/integration \
            -v --tb=short \
            --junitxml=reports/test-${{ matrix.python }}.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.python }}
          path: reports/test-${{ matrix.python }}.xml

  # ─────────────────────────────────
  # Summary Gate
  # ─────────────────────────────────
  ci-pass:
    name: "✅ CI"
    runs-on: ubuntu-latest
    needs: [lint, bdd, test]
    if: always()
    steps:
      - run: |
          for result in "${{ needs.lint.result }}" "${{ needs.bdd.result }}" "${{ needs.test.result }}"; do
            if [ "$result" != "success" ]; then
              echo "❌ Gate failed: $result"
              exit 1
            fi
          done
          echo "✅ All gates passed"

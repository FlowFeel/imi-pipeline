services:
  # ── Temporal Stack ──
  temporal-db:
    image: postgres:13
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes:
      - temporal-db-test:/var/lib/postgresql/data
      - ./init-temporal:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "temporal"]
      interval: 5s
      timeout: 3s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.22.3
    depends_on:
      temporal-db:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-db
      DBNAME: temporal
      LOG_LEVEL: error
    ports:
      - "7233:7233"
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep temporal-server | grep -v grep || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  # ── MW Stack ──
  db:
    image: mysql:8.4.0
    environment:
      MYSQL_DATABASE: mediawiki_test
      MYSQL_ROOT_PASSWORD: testpass
    volumes:
      - mw-db-test:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-ptestpass"]
      interval: 5s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    security_opt:
      - seccomp:unconfined
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: "-Xms256m -Xmx256m"
      xpack.security.enabled: "false"
      bootstrap.memory_lock: "false"
      "cluster.routing.allocation.disk.threshold_enabled": "false"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s

  web:
    image: ghcr.io/flowfeel/observatory-mediawiki:2.1.1-observatory
    depends_on:
      db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      MW_DB_TYPE: mysql
      MW_DB_SERVER: db
      MW_DB_NAME: mediawiki_test
      MW_DB_USER: root
      MW_DB_PASSWORD: testpass
      MW_SITE_SERVER: http://localhost:8085
      MW_SITE_NAME: Test Wiki
      MW_SITE_FQDN: localhost
      MW_ENABLE_ELASTICSEARCH: "true"
      MW_ELASTICSEARCH_HOST: elasticsearch
      MW_ELASTICSEARCH_PORT: "9200"
    ports:
      - "8085:80"
    volumes:
      - ./init:/init:ro
      - ./main-stubs/update-docker-gateway.sh:/update-docker-gateway.sh:ro
      - ./main-stubs/update-images-permissions.sh:/update-images-permissions.sh:ro
      - ./main-stubs/run-maintenance-scripts.sh:/run-maintenance-scripts.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/w/api.php || exit 1"]
      interval: 10s
      timeout: 10s
      start_period: 120s
      retries: 30

volumes:
  temporal-db-test:
  mw-db-test:
